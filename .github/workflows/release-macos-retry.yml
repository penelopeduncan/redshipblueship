name: release-macos-retry
# Re-runs a release run's "macOS build" when GitHub never found it a runner
# (#1655). The v0.5.1-alpha tag run lost its macOS leg that way three times
# (attempts 1-3, each cancelled after GitHub's 15-minute runner-acquisition
# limit with no step run); attempt 4, re-run by hand more than three hours
# later, got a runner. The details, and why only this kind of failure is
# retried, are in .github/scripts/retry-unacquired-macos.sh.
#
# It changes nothing in generate-builds: the release is still made from the
# Windows and Linux builds without waiting for macOS (#1501). The script
# re-runs only the "macOS build" job and the jobs that need it, and only when
# every other job of the attempt succeeded or was skipped, so the Windows and
# Linux assets are not rebuilt; release-macos then attaches the dmg to the
# existing release.
#
# Runs only for the runs that publish a release: a v* tag push, a release/v*
# branch push, or a dispatch (generate-builds' create-release and
# release-macos conditions). Pull requests and pushes to main are ignored.
# workflow_run always uses this file from the default branch, so the run is
# listed against main's tip; run-name names the release run it is about. A
# red run of this workflow therefore means that release still has no dmg, not
# that main is broken. Every other generate-builds completion shows here as a
# skipped run.
on:
  workflow_run:
    workflows: [generate-builds]
    types:
      - completed

run-name: >-
  macOS retry for ${{ github.event.workflow_run.head_branch }}
  (run ${{ github.event.workflow_run.id }} attempt ${{ github.event.workflow_run.run_attempt }})

permissions:
  actions: write
  # The script reads the macOS job's check-run annotations to tell a runner
  # shortage from a deliberate cancel.
  checks: read
  contents: read

jobs:
  retry-macos:
    # conclusion == 'failure': an unacquired macOS job ends the run 'failure'
    # because required-build-macos (if: always()) fails; a cancel by a person
    # or a concurrency group ends it 'cancelled', which is not retried.
    # run_attempt < 5: one more than the entries of the script's WAIT_SCHEDULE
    # (four re-runs), so the last attempt's completion never starts another
    # chain (tools/tests/test_retry_unacquired_macos.py locks the two).
    if: >-
      ${{ github.event.workflow_run.conclusion == 'failure'
      && github.event.workflow_run.run_attempt < 5
      && ((github.event.workflow_run.event == 'push'
           && (startsWith(github.event.workflow_run.head_branch, 'v')
               || startsWith(github.event.workflow_run.head_branch, 'release/v')))
          || github.event.workflow_run.event == 'workflow_dispatch') }}
    # One retrier per release run at a time; a later completion event waits
    # rather than cancelling the running one. GitHub keeps only one pending
    # run per group, so a third arrival cancels the pending second; that is
    # expected and harmless, since a retrier for an attempt that is no longer
    # the newest does nothing.
    concurrency:
      group: release-macos-retry-${{ github.event.workflow_run.id }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    # Worst case: about 190 minutes of pauses plus four ~16-minute unacquired
    # re-runs. The script exits as soon as a re-run's macOS job gets a runner,
    # so it never waits for the build itself.
    timeout-minutes: 350
    steps:
    - name: Git Checkout
      uses: actions/checkout@v4
      with:
        sparse-checkout: .github/scripts
        fetch-depth: 1
    - name: Re-run the macOS leg if no runner was acquired
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        RUN_ID: ${{ github.event.workflow_run.id }}
        RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
      run: bash .github/scripts/retry-unacquired-macos.sh
